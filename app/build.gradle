plugins {
    id 'com.android.application'
}

android {
    namespace 'com.storypocket.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.storypocket.mobile'
        minSdk 29
        targetSdk 35
        versionCode 14
        versionName '2.3.0-beta'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
