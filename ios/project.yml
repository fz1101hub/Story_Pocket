name: StoryPocket
options:
  bundleIdPrefix: com.storypocket
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  StoryPocket:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: StoryPocket
        NSPhotoLibraryAddUsageDescription: "StoryPocket saves media you explicitly choose."
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.storypocket.ios
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: StoryPocketShare
        embed: true
  StoryPocketShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extension
      - path: Sources/Shared
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Extension/Info.plist
      properties:
        CFBundleDisplayName: StoryPocket
        NSPhotoLibraryAddUsageDescription: "StoryPocket saves media you explicitly choose."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.storypocket.ios.share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
