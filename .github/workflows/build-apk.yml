name: Build StoryPocket APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout sorgenti
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest include già l'Android SDK: evitare setup-android@v3
      # perché la versione corrente tenta di installare il pacchetto
      # obsoleto "tools" e fallisce con "Failed to find package 'tools'".
      - name: Verifica Android SDK preinstallato
        run: |
          test -d "$ANDROID_HOME"
          command -v sdkmanager

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Installa Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test offline e controlli di sicurezza
        run: bash tests/run_preflight.sh

      - name: Test resolver Stories con org.json
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 -o "$RUNNER_TEMP/json.jar" https://repo.maven.apache.org/maven2/org/json/json/20250517/json-20250517.jar
          mkdir -p build/story-tests
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/json.jar" -d build/story-tests \
            app/src/main/java/com/storypocket/mobile/TargetParser.java \
            app/src/main/java/com/storypocket/mobile/VideoUrlPolicy.java \
            app/src/main/java/com/storypocket/mobile/InstagramStoryResolver.java \
            tests/StoryResolverCheck.java
          java -cp "build/story-tests:$RUNNER_TEMP/json.jar" StoryResolverCheck

      - name: Compila APK Android debug
        run: gradle --no-daemon assembleDebug

      - name: Verifica firma e versione
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -6
          sha256sum "$APK" > app-debug.sha256

      - name: Pubblica APK scaricabile
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StoryPocket-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          retention-days: 14
          if-no-files-found: error
