name: Build StoryPocket iOS Simulator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Build unsigned simulator app
        run: |
          xcodebuild -project ios/StoryPocket.xcodeproj -scheme StoryPocket -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/storypocket" CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator build
        run: |
          cd "$RUNNER_TEMP/storypocket/Build/Products/Debug-iphonesimulator"
          zip -qry "$GITHUB_WORKSPACE/StoryPocket-iOS-simulator.zip" StoryPocket.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StoryPocket-iOS-simulator
          path: StoryPocket-iOS-simulator.zip
          if-no-files-found: error
          retention-days: 14
